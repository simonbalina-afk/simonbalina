<style>/* Simón Baliña — Portfolio web
   Layout: grilla editorial de 12 columnas sobre papel cálido; líneas finas y referencias de plano técnico.
   Identidad de una sola luz (papel claro) por decisión de diseño: los colores se definen todos acá. */
:root{
  --paper:#F5F3EE; --paper-2:#ECE9E2; --ink:#1C1C1C; --ink-2:#3B3A37; --mid:#6E6D69; --line:#D8D6D0;
  --acc:#52677A; --acc-ink:#3E5263; --white:#FFFFFF; --shade:#191918;
  --font:"proxima-nova","Proxima Nova","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(16px,2.2vw,36px); --maxw:1680px; --hdr:64px;
  --t-display:clamp(3.1rem,9.4vw,9.6rem); --t-h1:clamp(2.4rem,5.6vw,5.4rem); --t-h2:clamp(1.65rem,3vw,2.7rem);
  --t-h3:clamp(1.12rem,1.4vw,1.3rem); --t-lead:clamp(1.2rem,1.75vw,1.6rem); --t-body:1.0625rem; --t-small:.9rem; --t-lab:.72rem;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--t-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
img{max-width:100%;display:block;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
.bleed-x{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.lab{font-size:var(--t-lab);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.lab.acc{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;letter-spacing:-.025em;line-height:1.02;margin:0;text-wrap:balance}
h2{font-size:var(--t-h2);font-weight:600;letter-spacing:-.02em;line-height:1.1}
h3{font-size:var(--t-h3);font-weight:600;letter-spacing:-.01em;line-height:1.25}
p{margin:0 0 1em;max-width:62ch;color:var(--ink-2)}
p b,li b{color:var(--ink);font-weight:600}
.lead{font-size:var(--t-lead);font-weight:300;line-height:1.35;letter-spacing:-.01em;color:var(--ink);max-width:34ch}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:100}
.skip:focus{left:16px}

/* ── Header ───────────────────────────── */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--hdr)}
.brand{font-weight:700;letter-spacing:-.01em;text-decoration:none;font-size:1.02rem;white-space:nowrap}
.brand span{font-weight:300;color:var(--mid)}
.nav{display:flex;gap:clamp(14px,2.6vw,40px);align-items:center}
.nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.92rem;position:relative;padding:6px 0}
.nav a::after,.ulink::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav a:hover::after,.nav a[aria-current="true"]::after,.ulink:hover::after{transform:scaleX(1);transform-origin:left}
.crumb{display:none;font-size:.82rem;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-project .crumb{display:block}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
@media (max-width:720px){.brand span{display:none}.nav{gap:12px}.nav a{font-size:.82rem}.is-project .crumb{display:none}}

/* ── Reveal ───────────────────────────── */
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.pending{opacity:0;transform:translateY(22px)}
@media (prefers-reduced-motion:reduce){.rv,.rv.pending{opacity:1!important;transform:none!important;transition:none}}

/* ── Figures ──────────────────────────── */
figure{margin:0;min-width:0}
.fig{position:relative;overflow:hidden;background:var(--paper-2)}
.fig.paper{background:var(--white)}
.fig.clear{background:transparent}
.fig img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.fig.contain img{object-fit:contain}
.mul img{mix-blend-mode:multiply}
.zoom{cursor:zoom-in;display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.zoom:hover img{transform:scale(1.025)}
.zoom .zi{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center;opacity:0;transform:scale(.85);transition:.35s var(--ease);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.zoom:hover .zi,.zoom:focus-visible .zi{opacity:1;transform:none}
figcaption{font-size:.8rem;color:var(--mid);padding-top:10px;line-height:1.4;max-width:60ch}
figcaption .ref{color:var(--acc);font-weight:600;margin-right:.7em;font-variant-numeric:tabular-nums}
@media (hover:none){.zoom .zi{opacity:.9;transform:none}}

/* ── Home hero ────────────────────────── */
.hero-home{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);padding-block:clamp(28px,5vw,72px) clamp(40px,6vw,96px);align-items:end;position:relative}
.hh-text{grid-column:1 / span 5;grid-row:1;position:relative;z-index:2}
.hh-img{grid-column:6 / -1;grid-row:1;position:relative}
.hh-img .fig{aspect-ratio:16/10.5}
.hh-name{font-size:clamp(3.1rem,7.6vw,8.4rem);font-weight:700;letter-spacing:-.055em;line-height:.86;margin:0 0 .18em;white-space:nowrap}
.hh-name .l{display:block;overflow:hidden;padding-bottom:.04em}
.hh-name .l span{display:inline-block}
.hh-role{font-size:clamp(1rem,1.3vw,1.2rem);font-weight:600;margin-bottom:6px}
.hh-thesis{font-size:var(--t-lead);font-weight:300;color:var(--ink-2);margin-bottom:28px}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks span{position:absolute;font-size:.66rem;color:var(--mid);letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:600;background:transparent;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn .ar{transition:transform .35s var(--ease)}
.btn:hover .ar{transform:translateY(3px)}
.btn.r:hover .ar{transform:translateX(4px)}
.scrollhint{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--mid);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.scrollhint i{display:block;width:1px;height:34px;background:var(--line);position:relative;overflow:hidden}
.scrollhint i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:drip 2.2s var(--ease) infinite}
@keyframes drip{to{top:110%}}
@media (prefers-reduced-motion:reduce){.scrollhint i::after{animation:none}}
.enter .hh-name .l span{animation:rise 1.1s var(--ease) both}
.enter .hh-name .l:nth-child(2) span{animation-delay:.08s}
.enter .hh-sub{animation:fade 1s .35s var(--ease) both}
.enter .hh-img .fig{animation:unveil 1.4s .15s var(--ease) both}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@keyframes unveil{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.enter *{animation:none!important}}
@media (max-width:900px){.hero-home{grid-template-columns:1fr}.hh-text,.hh-img{grid-column:1;grid-row:auto}.hh-img{order:-1}.hh-name{white-space:normal}}

/* ── Section heads ────────────────────── */
.sec{padding-block:clamp(56px,8vw,128px);border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);margin-bottom:clamp(32px,4vw,64px);align-items:end}
.sec-head .lab{grid-column:1 / span 3}
.sec-head h2{grid-column:4 / span 7;font-size:var(--t-h1);font-weight:700;letter-spacing:-.04em;line-height:.98}
.sec-head .aside{grid-column:11 / -1;font-size:.85rem;color:var(--mid);text-align:right}
@media (max-width:900px){.sec-head{grid-template-columns:1fr}.sec-head>*{grid-column:1!important;text-align:left!important}}

/* ── Work index ───────────────────────── */
.works{display:flex;flex-direction:column;gap:clamp(56px,8vw,128px)}
.work{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);text-decoration:none;align-items:end;position:relative}
.work .w-img{min-width:0}
.work .w-meta{min-width:0;display:flex;flex-direction:column;gap:10px}
.work .w-n{font-size:clamp(3rem,6vw,6rem);font-weight:300;letter-spacing:-.05em;line-height:.8;color:var(--ink);font-variant-numeric:tabular-nums}
.work .w-t{font-size:clamp(1.7rem,3.2vw,3rem);font-weight:700;letter-spacing:-.035em;line-height:1}
.work .w-c{font-size:.9rem;color:var(--mid)}
.work .w-s{font-size:1rem;color:var(--ink-2);max-width:36ch;margin:0}
.work .w-go{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;margin-top:6px}
.work .w-go i{display:block;height:1px;width:28px;background:currentColor;transition:width .5s var(--ease)}
.work:hover .w-go i,.work:focus-visible .w-go i{width:64px}
.work .fig img{transition:transform 1.2s var(--ease)}
.work:hover .fig img{transform:scale(1.035)}
.work .w-line{grid-column:1 / -1;height:1px;background:var(--line);position:relative;order:-1}
.work .w-line::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.work:hover .w-line::after{transform:scaleX(1)}
.v-a .w-img{grid-column:1 / span 8}.v-a .w-meta{grid-column:9 / -1}
.v-b .w-img{grid-column:6 / -1;grid-row:2}.v-b .w-meta{grid-column:1 / span 4;grid-row:2;align-self:start}
.v-c .w-img{grid-column:1 / -1}.v-c .w-meta{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:12px 28px}
.v-d .w-img{grid-column:3 / span 6}.v-d .w-meta{grid-column:9 / -1}
.v-c .w-s{flex:1 1 280px}
@media (max-width:900px){.work{grid-template-columns:1fr}.work .w-img,.work .w-meta{grid-column:1!important;grid-row:auto!important}}

/* ── About / contact ──────────────────── */
.about{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut)}
.about .ph{grid-column:1 / span 4}
.about .tx{grid-column:6 / -1;min-width:0}
.about .lead{max-width:30ch;margin-bottom:28px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px var(--gut);margin-top:40px}
.kv h3{font-size:var(--t-lab);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:14px;font-size:.98rem}
.rows li .k{color:var(--mid);font-size:.82rem;padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tags li{border:1px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
@media (max-width:900px){.about{grid-template-columns:1fr}.about .ph,.about .tx{grid-column:1}.about .ph{max-width:420px}.kv{grid-template-columns:1fr}}
.contact{padding-block:clamp(72px,11vw,180px)}
.contact h2{font-size:clamp(2.6rem,8vw,8rem);font-weight:700;letter-spacing:-.05em;line-height:.92;margin-bottom:clamp(28px,4vw,56px);max-width:12ch}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:28px}
.mail .addr{font-size:clamp(1.3rem,3.2vw,2.6rem);font-weight:300;letter-spacing:-.02em;user-select:all;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--white);cursor:pointer;font-weight:600;font-size:.88rem;text-decoration:none;transition:border-color .3s}
.chip:hover{border-color:var(--ink)}
.contact .more{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px;color:var(--mid)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:.35s var(--ease);z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer.ft{border-top:1px solid var(--line);padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));font-size:.82rem;color:var(--mid)}
footer.ft .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ── Project page ─────────────────────── */
.p-hero{position:relative}
.p-hero.full .stage{position:relative;aspect-ratio:16/9;max-height:calc(100vh - var(--hdr));min-height:420px;overflow:hidden;background:var(--paper-2)}
.p-hero.full .stage img{width:100%;height:100%;object-fit:cover}
.p-hero.full .ovl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--gut);background:linear-gradient(to top,rgba(245,243,238,.94) 0%,rgba(245,243,238,.72) 32%,rgba(245,243,238,0) 62%)}
.p-hero.full.dark .ovl{background:linear-gradient(to top,rgba(20,18,16,.85),rgba(20,18,16,.25) 45%,rgba(20,18,16,0) 70%);color:var(--paper)}
.p-hero.full.dark .ovl .lab,.p-hero.full.dark .ovl p,.p-hero.full.dark .ovl .p-num{color:var(--paper)}
.p-num{font-size:clamp(3.5rem,9vw,8.5rem);font-weight:300;letter-spacing:-.06em;line-height:.8;font-variant-numeric:tabular-nums}
.p-title{font-size:var(--t-h1);font-weight:700;letter-spacing:-.045em;line-height:.95;margin:.08em 0 .2em}
.p-sub{font-size:var(--t-lead);font-weight:300;color:var(--ink-2);margin:0 0 .4em}
.p-intro{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);padding-block:clamp(32px,4vw,64px)}
.p-intro .lead{grid-column:1 / span 6;max-width:40ch}
.p-intro .rows{grid-column:8 / -1}
@media (max-width:900px){.p-intro{grid-template-columns:1fr}.p-intro>*{grid-column:1!important}}
.p-hero.split{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);padding-top:clamp(24px,4vw,56px);align-items:end}
.p-hero.split .ht{grid-column:1 / span 5;min-width:0}
.p-hero.split .hi{grid-column:6 / -1;min-width:0}
.p-hero.wide .hi{margin-top:clamp(20px,3vw,40px)}
.p-hero .logo{max-width:220px;margin-top:20px;mix-blend-mode:multiply}
.p-hero.tri .hi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0d0f10}
@media (max-width:900px){.p-hero.split{grid-template-columns:1fr}.p-hero.split .ht,.p-hero.split .hi{grid-column:1}.p-hero.split .hi{order:-1}.p-hero.full .stage{aspect-ratio:4/5;min-height:0;max-height:none}.p-hero.full .stage img{object-position:var(--mpos,50% 50%)}}

.blk{padding-block:clamp(40px,6vw,96px)}
.blk+.blk{border-top:1px solid var(--line)}
.blk-head{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);margin-bottom:clamp(24px,3vw,44px);align-items:end}
.blk-head .lab{grid-column:1 / span 3;align-self:start;padding-top:.5em}
.blk-head h2{grid-column:4 / span 8}
.blk-head .bt{grid-column:4 / span 6;margin-top:14px}
.blk-head .bt p{margin:0}
@media (max-width:900px){.blk-head{grid-template-columns:1fr}.blk-head>*{grid-column:1!important}}
.cols2{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut)}
.cols2 .c{grid-column:span 5}
.cols2 .c:first-child{grid-column:4 / span 4}
.cols2 .c:last-child{grid-column:span 5}
.cols2 h3{font-size:var(--t-lab);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
@media (max-width:900px){.cols2{grid-template-columns:1fr}.cols2 .c{grid-column:1!important}}
.row{display:flex;gap:var(--gut);align-items:flex-start}
.row>figure{min-width:0}
.row.stack{flex-direction:column}
.row.stack>figure{width:100%}
.note-sm{font-size:.82rem;color:var(--mid);margin-top:12px}
@media (max-width:720px){.row:not(.keep){flex-direction:column}.row>figure{flex:none!important;width:100%}}
.sticky{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);align-items:start}
.sticky .st{grid-column:1 / span 4;position:sticky;top:calc(var(--hdr) + 32px + env(safe-area-inset-top,0px));min-width:0}
.sticky .si{grid-column:6 / -1;display:flex;flex-direction:column;gap:clamp(20px,3vw,40px);min-width:0}
.sticky .st .big{font-size:clamp(3rem,6vw,5.5rem);font-weight:300;letter-spacing:-.06em;line-height:.8;color:var(--acc);margin-bottom:14px}
.sticky .st h2{margin:.35em 0 .6em}
@media (max-width:900px){.sticky{grid-template-columns:1fr}.sticky .st,.sticky .si{grid-column:1;position:static}}

.seq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut);counter-reset:s}
.seq .s{display:flex;flex-direction:column;gap:12px;min-width:0}
.seq .s-top{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--ink);padding-top:12px;position:relative}
.seq .s-top .n{font-size:1.6rem;font-weight:300;letter-spacing:-.04em;color:var(--acc);font-variant-numeric:tabular-nums}
.seq .s-top .arrow{margin-left:auto;color:var(--acc)}
.seq .s p{font-size:.95rem}

@media (max-width:900px){.specs{grid-template-columns:1fr}.specs>*{grid-column:1!important}}

/* viewer + tabs */
.viewer{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);align-items:start}
.viewer .vs{grid-column:1 / span 8;min-width:0}
.viewer .vp{grid-column:9 / -1;min-width:0}
.stage-v{position:relative;background:var(--paper-2);aspect-ratio:var(--ar,16/10);overflow:hidden}

.vbar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.vthumbs{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.vthumb{width:72px;height:52px;padding:0;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;overflow:hidden;opacity:.6;transition:.3s}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb[aria-selected="true"],.vthumb:hover{opacity:1;border-color:var(--ink)}
.varrows{display:flex;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;transition:border-color .3s}
.iconbtn:hover{border-color:var(--ink)}
.vcap{font-size:.82rem;color:var(--mid);margin-top:10px;min-height:1.4em}
.vcount{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--mid);margin-left:auto}
@media (max-width:900px){.viewer{grid-template-columns:1fr}.viewer>*{grid-column:1!important}}
.tablist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(20px,3vw,36px)}

.tab .n{color:var(--mid);font-weight:400;font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--ink)}

.tab[aria-selected="true"] .n{color:var(--paper);opacity:.6}
.t-play .tab[aria-selected="true"]{background:#5B3B2E;border-color:#5B3B2E}
.panel[hidden]{display:none}

/* products */
.pgroups{display:flex;flex-direction:column;gap:clamp(36px,5vw,72px)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:clamp(10px,1.4vw,20px)}
.pcard .fig{aspect-ratio:1/1;background:var(--white)}

.chapter{padding-block:clamp(48px,7vw,112px) clamp(12px,2vw,24px);display:flex;align-items:baseline;gap:clamp(16px,3vw,40px);border-top:1px solid var(--ink)}

/* project nav */

.pnav .t{font-size:clamp(1.6rem,3.6vw,3.4rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.pnav .next:hover img{transform:scale(1.04)}
@media (max-width:900px){.pnav .wrap{grid-template-columns:1fr}.pnav .prev,.pnav .next{grid-column:1}.pnav .next{grid-template-columns:1fr}}

/* tones */
.t-red{--acc:#B7141B;--acc-ink:#8E0F15}
.t-play{--acc:#7A5A2E}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:var(--shade);display:grid;grid-template-rows:auto 1fr auto;color:#F5F3EE;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem}
.lb-stage{position:relative;min-height:0;display:grid;place-items:center;touch-action:pan-y;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .3s}
.lb-stage img.paper{background:#fff}
.lb-cap{text-align:center;font-size:.9rem;padding-top:10px;color:#D8D6D0;min-height:1.6em}
.lb .iconbtn{background:transparent;border-color:rgba(245,243,238,.35);color:#F5F3EE}
.lb .iconbtn:hover{border-color:#F5F3EE}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%)}
.lb-prev{left:4px}.lb-next{right:4px}
@media (max-width:640px){.lb-prev,.lb-next{top:auto;bottom:4px;transform:none}}
h1:focus{outline:none}

/* ════════════════════════════════════════════════════════════════
   v2 · Sistema compartido CV · PDF · web
   Recursos: marcas de registro, contornos desplazados, nodos y líneas
   de tiempo, cotas, identificadores de figura, contraste Light/Bold.
   ════════════════════════════════════════════════════════════════ */
:root{--mid:#757470;--line:#CFCCC4;--soft:#E4E1DA}
.lab .num{color:var(--ink);font-weight:600;margin-right:1em;letter-spacing:.08em}
.lab.ink{color:var(--ink)}
.sl{color:var(--line);margin:0 .25em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2 b,.p-title b,.w-t b,.pnav .t b,.chapter h2 b{font-weight:700}
h2 .l,.p-title .l,.w-t .l,.pnav .t .l,.chapter h2 .l{font-weight:300}
.blk-head h2{font-size:clamp(1.7rem,3.1vw,2.9rem);letter-spacing:-.03em;line-height:1.04}

/* menos líneas divisorias: el ritmo lo da el espacio */
.sec{border-top:0}
.blk+.blk{border-top:0}
.sec-head{position:relative;padding-top:22px}
.sec-head::before{content:"";position:absolute;left:0;top:0;width:44px;height:1px;background:var(--ink)}
.sec-head h2 b{font-weight:700}.sec-head h2 .l{font-weight:300}

/* identificadores de figura */
figcaption .ref,.figcap .ref{color:var(--ink);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.66rem;margin-right:1em}
.figcap{display:flex;align-items:baseline;gap:0;font-size:.8rem;color:var(--mid);margin-top:18px}
.figcap .nn{margin-left:auto;color:var(--mid)}
.figcap .nn b{color:var(--ink);font-weight:600}

/* marcas de registro y contorno: fijos (.on) o al explorar una imagen */
.framed,.zoom{position:relative}
.cx{position:absolute;inset:-9px;pointer-events:none;z-index:2}
.cx::before{content:"";position:absolute;inset:0;border:1px solid var(--ink);opacity:0;transform:scale(1.012);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.cx i{position:absolute;width:11px;height:11px;opacity:0;transform:scale(.4) rotate(45deg);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.cx i::before,.cx i::after{content:"";position:absolute;background:var(--ink)}
.cx i::before{left:0;right:0;top:5px;height:1px}
.cx i::after{top:0;bottom:0;left:5px;width:1px}
.cx .a{left:-12px;top:-12px}.cx .b{right:-12px;top:-12px}.cx .c{left:-12px;bottom:-12px}.cx .d{right:-12px;bottom:-12px}
.cx.on::before{opacity:1;transform:none}
.cx.on i{opacity:1;transform:none}
.zoom:hover .cx i,.zoom:focus-visible .cx i,.work:hover .cx i,.work:focus-visible .cx i,.pnav .next:hover .cx i,.pnav .next:focus-visible .cx i{opacity:1;transform:none}
.zoom:hover .cx::before,.zoom:focus-visible .cx::before,.work:hover .cx::before,.work:focus-visible .cx::before{opacity:.85;transform:none}
.zoom:focus-visible{outline:none}
.cx .b{transition-delay:.04s}.cx .c{transition-delay:.08s}.cx .d{transition-delay:.12s}
@media (prefers-reduced-motion:reduce){.cx::before,.cx i{transition:none}}
@media (hover:none){.zoom .cx{display:none}}

/* ── portada ──────────────────────────── */
.hero-home{grid-template-columns:repeat(12,1fr);align-items:center;min-height:calc(100svh - var(--hdr) - 10px);padding-block:clamp(28px,4vw,64px) clamp(28px,4vw,56px)}
.hh-text{grid-column:1 / span 6;grid-row:1}
.hh-img{grid-column:8 / -1;grid-row:1;align-self:center}
.hh-img .framed{margin:9px}
.hh-sub .sl{margin:0 .3em}
.hh-name{font-size:clamp(3.3rem,8.6vw,10.4rem);text-transform:uppercase;letter-spacing:-.055em;line-height:.84;margin:.32em 0 .22em;white-space:nowrap}
.hh-name .n1{font-weight:300}.hh-name .n2{font-weight:700}
.cota{display:flex;align-items:center;gap:12px;margin:clamp(18px,2.4vw,34px) 0 clamp(18px,2vw,28px);max-width:min(100%,640px)}

.hh-thesis{font-size:clamp(1.25rem,1.9vw,1.75rem);font-weight:300;color:var(--ink);line-height:1.22;margin-bottom:28px}
.hh-lead{display:none}
.hero-home .scrollhint{grid-column:1 / -1;grid-row:2;margin-top:clamp(20px,3vw,40px);display:flex;align-items:center;gap:14px}
.hero-home .scrollhint .num{margin-left:auto}
.scrollhint i{position:relative}
.scrollhint i::before{content:"";position:absolute;left:-3px;top:-6px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
@media (max-width:900px){.hero-home{min-height:0}.hh-text,.hh-img{grid-column:1;grid-row:auto}.hh-img{order:0;margin-top:8px}.hero-home .scrollhint{grid-row:auto}.hero-home .scrollhint .num{display:none}}

/* ── índice de proyectos ──────────────── */
.work .w-line{display:none}
.work .w-img .framed{margin:9px}
.work .w-n{font-weight:300;letter-spacing:-.06em}
.work .w-t{font-weight:700}
.work .w-go{gap:0}
.work .w-go i{position:relative;margin-right:12px;width:30px}
.work .w-go i::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.work:hover .w-go i,.work:focus-visible .w-go i{width:60px}

/* ── aperturas de proyecto ────────────── */
.p-title{font-weight:700}
.p-hero .lab.ink{color:var(--ink)}
.p-hero.full.dark .lab.ink{color:var(--paper)}
.p-hero.split .hi .framed{margin:9px}
.rows{border-top:0}
.rows li{border-bottom:1px solid var(--soft);padding:9px 0}
.rows li .k{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding-top:4px}

/* ── secuencia: línea de tiempo con nodos ─ */
.seq .s-top{border-top:1px solid var(--ink);padding-top:14px;position:relative}
.seq .s:not(.last) .s-top::after{content:"";position:absolute;top:-1px;left:100%;width:var(--gut);height:1px;background:var(--ink)}
.seq .s-top .node{position:absolute;left:0;top:-5px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:var(--paper)}
.seq .s.last .s-top .node{background:var(--ink)}
.seq .s-top .n{color:var(--ink);font-weight:300}
@media (max-width:1100px){.seq .s:nth-child(2n) .s-top::after{display:none}}
@media (max-width:640px){.seq .s{border-left:1px solid var(--ink);padding-left:18px}.seq .s-top{border-top:0;padding-top:0}.seq .s-top::after{display:none}.seq .s-top .node{left:-23px;top:8px}}

/* ── listas técnicas con nodos ────────── */
.dlist{border-top:0;position:relative}
.dlist::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:1px;background:var(--line)}
.dlist li{border-bottom:0;padding:12px 0 12px 22px;position:relative}
.dlist li::before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:var(--paper)}
.dlist li:first-child::before{background:var(--ink)}
.dlist .k{font-weight:300;font-size:1.5rem;letter-spacing:-.03em}
.spec-t th,.spec-t td{border-bottom-color:var(--soft)}
.spec-t td{font-weight:300;font-size:1.3rem;letter-spacing:-.02em}

/* ── notas y etiquetas ────────────────── */
.pill{display:inline-block;font-size:.64rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:6px 12px 5px;line-height:1.2}
.note{align-items:start}
.note .pill{grid-column:1 / span 3;justify-self:start}
.note p{border-left:1px solid var(--ink)}
.chapter{border-top:0;position:relative}
.chapter::before{content:"";position:absolute;left:0;top:0;width:44px;height:1px;background:var(--ink)}
.chapter .n{color:var(--ink);font-weight:300}
.t-red .chapter .n{color:var(--acc)}

/* ── sobre mí (lenguaje del CV) ───────── */
.about{grid-template-columns:repeat(12,1fr);row-gap:clamp(28px,4vw,56px)}
.about .ph{grid-column:1 / span 3}
.about .ph .framed{margin:9px}
.about .tx{grid-column:5 / span 5}
.about .edu{grid-column:10 / -1}
.quote{font-size:clamp(1.55rem,2.5vw,2.45rem);font-weight:600;letter-spacing:-.025em;line-height:1.14;margin-bottom:28px;max-width:none;color:var(--ink)}
.quote .ul{position:relative;display:inline-block}
.quote .ul svg{position:absolute;left:-2px;right:-2px;bottom:-.32em;width:calc(100% + 4px);height:.3em;fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;overflow:visible}
.lead-s{font-size:1.08rem;color:var(--ink2)}
.edu .hh{font-size:1.5rem;letter-spacing:-.03em;margin-bottom:4px}
.edu .hs{font-size:.8rem;color:var(--mid);margin-bottom:22px}
.tl{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:24px;width:1px;background:var(--line)}
.tl li{position:relative;display:flex;flex-direction:column;margin-bottom:22px}
.tl li::before{content:"";position:absolute;left:-24px;top:6px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:var(--paper)}
.tl li.cur::before{background:var(--ink)}
.tl .yr{font-size:1.02rem;letter-spacing:-.01em}
.tl .yr b{font-weight:700}.tl .yr .l{font-weight:300;color:var(--mid)}
.tl .t{font-weight:600;font-size:.95rem;margin-top:4px;line-height:1.3}
.tl .o{font-size:.86rem;color:var(--ink2)}
.about-band{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;margin-top:clamp(48px,6vw,96px);border-top:1px solid var(--ink)}
.about-band>div{padding:22px var(--gut) 0;border-left:1px solid var(--line)}
.about-band>div:first-child{border-left:0;padding-left:0}
.about-band h3{margin-bottom:18px}
.about-band .band-caps{grid-column:1 / -1;border-left:0;padding-left:0;margin-top:clamp(36px,4vw,56px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:var(--gut);align-items:start}
.band-caps h3{grid-column:1 / -1}
.band-caps .caps{columns:2;column-gap:var(--gut)}
.band-caps .caps li{break-inside:avoid}

<script>window.SB_DATA={"site":{"name":"Simón Baliña","role":"Diseño de Producto / Mobiliario / Objetos","thesis":"Del concepto a la materialización.","email":"simonbalina@gmail.com","phone":"+54 9 351 320 1330","pdf":"Simon_Balina_Portfolio_2026.pdf","year":"2026"},"about":{"quote":["Pienso el diseño desde la","lógica del material"],"lead":"Me motiva explorar cómo la forma y la textura dialogan con el uso, llevando las ideas más allá del concepto para resolver cómo se fabrican o realizan.","body":"Estudiante de la Licenciatura en Diseño, trabajo de manera integral: analizo el problema, boceto, maqueteo y paso al desarrollo técnico de despieces, uniones, planos y prototipos. Mi enfoque combina la observación detallada con la precisión constructiva para transformar ideas en piezas tangibles y bien resueltas.","education":[["2011 — 2022","Bachiller con orientación en Comunicación","Escuela Castelfranco Bilingüe Bicultural"],["2023 — actualidad","Licenciatura en Diseño","Universidad Católica de Córdoba (UCC)"],["2026","Semestre en ESDi Barcelona — Universidad Ramon Llull","Intercambio académico"]],"interests":["Diseño de producto","Mobiliario","Materialidad","Resolución constructiva","Experiencia de uso"],"capabilities":["Pensamiento espacial y estructural","Conceptualización y desarrollo de producto","Materialidad, procesos y sustentabilidad","Dibujo técnico y representación precisa","Diseño centrado en el usuario y la experiencia","Comunicación visual y síntesis proyectual"],"tools":["Autodesk Fusion 360","SolidWorks","SketchUp","Adobe Illustrator","Adobe Photoshop","Microsoft Office"],"toolset":[["3D / Modelado",[["tool_fusion360","Autodesk Fusion 360","Modelado paramétrico 3D",0.58],["tool_solidworks","SolidWorks","CAD paramétrico 3D",0.52],["tool_sketchup","SketchUp","Modelado 3D",0.56]]],["Gráfica / Diseño",[["tool_illustrator","Adobe Illustrator","Gráfica vectorial",0.52],["tool_photoshop","Adobe Photoshop","Edición de imagen",0.52]]],["Ofimática",[["tool_office","Microsoft Office","Documentos y presentaciones",0.55]]]],"languages":[["ES","Castellano","Nativo","flag_es"],["IT","Italiano","Nivel alto","flag_it"],["EN","Inglés","Nivel medio","flag_gb"],["PT","Portugués","Nivel medio","flag_pt"]],"portrait":"me_v2"},"projects":[{"slug":"lounge-nap","title":"Lounge NAP","cat":"Mobiliario · Contrachapado 10 mm","year":"2026","thumb":"n_cover","tone":"wood","summary":"Reinterpretación de la pausa: del clásico lounge a la síntesis del contrachapado.","blocks":[{"t":"hero","img":"n_cover","pos":"30% 50%","layout":"full","intro":"Reinterpretación de la pausa; del clásico lounge a la síntesis del contrachapado.","meta":[["Contexto","Proyectos I · ESDi Barcelona · 2026"],["Desafío","Asiento de descanso solo con madera de 10 mm y encastres"],["Material","Contrachapado 10 mm · 4 placas"],["Sistema","Encastres autoportantes, sin refuerzos"],["Posiciones","Espera · NAP (108° / 95°)"],["Rol","Proyecto individual — de la idea al prototipo"]]},{"t":"text","label":"Concepto","h":"Entender qué hace que un asiento sea cómodo de verdad.","cols":[["01 · El ADN del proyecto","Desde el principio, mi búsqueda no fue solo hacer una silla, sino entender qué hace que un asiento sea cómodo de verdad. <b>Me obsesioné con las Lounge Chairs</b> por esa posición de relax total que te dan cuando estás en tu casa. Mi idea fue desarmar esa comodidad para ver si podía pasarla a un lenguaje de planos finitos, buscando que el resultado sea algo sencillo pero que te den ganas de sentarte a descansar apenas lo ves."],["02 · Punto de partida","La consigna era difícil: hacer un asiento que funcione usando solamente madera de 10 mm y encastres. No quería hacer una silla de comedor común, sino un lugar de descanso total para el hogar. El desafío era ver si una lámina tan fina podía aguantar el cuerpo en una posición de reposo sin tener que agregarle patas o estructuras extra que arruinaran la simplicidad de la pieza."]]},{"t":"row","imgs":[["n_refs","Referentes — Eames Lounge Chair, Silla Wassily, BKF"],["n_ply","Contrachapado 10 mm"]],"paper":true},{"t":"sticky","label":"Ideación","num":"03","h":"Volumen a partir de planos.","text":"En mis primeros trazos exploré el método deconstructivo: cómo generar volumen a través del aire entre placas paralelas. Mi objetivo era entender cómo el desfase rítmico de los planos podía envolver el cuerpo.<br><br>Esta etapa de <b>sketches y maquetas rápidas fue vital para visualizar la silla no como un objeto cerrado, sino como una secuencia de secciones</b> que definen el espacio que el usuario habita.","imgs":[["n_sketch","Bocetos de intención y búsqueda del volumen"],["n_iso","Encastre — unión de placas"]],"paper":true},{"t":"sequence","label":"Proceso","h":"Problema → prueba → decisión → solución","quote":"“La estabilidad no debía buscarse en la extensión, sino en la inteligencia del encastre; era necesario editar para recuperar la rigidez.”","steps":[["Problema","El nudo crítico y la “tercera pieza”","Haciendo las maquetas me di cuenta de que si unía el asiento con el respaldo directamente, la madera de 10 mm se doblaba y no aguantaba. Para frenar eso, metí una tercera pieza en el medio como refuerzo. Una vez estabilizado el nudo, decidí que esta pieza no podía ser solo estructural: debía ganar su lugar ofreciendo una segunda función.",["n_04"]],["Prueba","Tres respaldos y la crisis de escala","Esa pieza terminó siendo la clave para probar un sistema de tres respaldos y tres posiciones, desde una postura de espera hasta un reposo absoluto. Para que el apoyo fuera seguro, <b>la silla creció hasta alcanzar un metro de profundidad</b>: funcionaba, pero no servía para una casa.",["n_05","n_06"]],["Decisión","La poda funcional","La madurez del proyecto llegó con la capacidad de renunciar. La tercera placa era un vicio estructural que podía resolverse con una mejor ingeniería de los planos principales. <b>Eliminé la tercera posición inestable y compacté la escala</b>: me quedé con las dos imprescindibles, Espera y NAP.",["n_07"]],["Solución","Resolución técnica X-Y-Z","Logré que la estructura fuera estable mediante <b>un sistema de encastres donde las piezas principales se traban entre sí</b>. Al diseñar esta triangulación de forma precisa, eliminé la necesidad de refuerzos externos: el propio material de 10 mm genera la rigidez necesaria.",["n_09"]]]},{"t":"grid","label":"Síntesis formal","h":"La forma y la estructura son la misma cosa.","text":"Con calados geométricos se alivianó la carga visual de los laterales, eliminando material en las zonas libres de cargas. La forma definitiva de las tapas usa los mismos ángulos de las dos posiciones de respaldo, y cada encastre se verificó en sus tolerancias: un corte demasiado profundo debilitaba la placa; uno superficial comprometía la rigidez.","imgs":[["n_08","Limpiar las placas — calados geométricos"],["n_10","Síntesis final — arquitectura del nudo"],["n_11a","Con-formado — variantes de tapa lateral"],["n_12","Precisión y ajuste fino — micro-geometría del ensamble"]],"paper":true},{"t":"specs","label":"Documentación técnica","h":"Planos generales y despiece","text":"Vistas generales, axonometría y despiece de las cuatro placas. Tocá cualquier lámina para ampliarla.","main":["n_13","Plano general — vistas y axonometría"],"imgs":[["n_131","13.1 — Placa lateral"],["n_132","13.2 — Respaldo alto"],["n_133","13.3 — Respaldo bajo"],["n_134","13.4 — Placa asiento"]],"specs":[["Ancho","750 mm"],["Placa lateral","700 × 700 mm"],["Espesor","10 mm"],["Respaldos","108° · 95°"],["Piezas","4 placas"]]},{"t":"row","label":"Detalle de encastres","imgs":[["n_rd2","Detalle de encastres — render"],["n_rd1","Encuentro de placas — render"]],"stack":true},{"t":"pair","label":"Render y resultado real","h":"Del render al prototipo construido.","text":"Prototipo construido a escala real en contrachapado de 10 mm. Las dos posiciones —Espera y NAP— se verificaron con el cuerpo.","a":["n_r4","Render final"],"b":["n_p1","Prototipo construido"]},{"t":"row","imgs":[["n_r2","Render — vista"],["n_r3","Render — vista"],["n_r1","Render — vista"]],"note":"Renders en su resolución original (520–840 px)."},{"t":"row","imgs":[["n_p2","Prototipo en uso"],["n_p3","Prototipo — vista"]]},{"t":"grid","label":"Fotos de proceso","h":"Corte, armado y verificación en taller.","cols":5,"imgs":[["n_pr0","Registro de proceso"],["n_pr1","Registro de proceso"],["n_pr2","Registro de proceso"],["n_pr3","Registro de proceso"],["n_pr4","Registro de proceso"],["n_pr5","Registro de proceso"],["n_pr6","Registro de proceso"],["n_pr7","Registro de proceso"],["n_pr8","Registro de proceso"],["n_pr9","Registro de proceso"]]}],"num":"01"},{"slug":"sillon-ak","title":"Sillón AK","cat":"Mobiliario · Encargo Andre Kevin Muebles","year":"2026","thumb":"ak_main","tone":"dark","summary":"Sillón modular de módulos tapizados con elemento central de madera.","blocks":[{"t":"hero","img":"ak_main","layout":"wide","intro":"Sillón de <b>módulos tapizados de asiento y respaldo</b>, organizados sobre una estructura inferior común. Un <b>elemento central con tapa de madera</b> se intercala entre los módulos y funciona como mesa de apoyo.","meta":[["Cliente","Andre Kevin Muebles (AK)"],["Tipo","Encargo · sillón modular"],["Rol","Diseño, modelado 3D, renders y plano"],["Año","2026"]]},{"t":"viewer","label":"Vistas","h":"Volúmenes blandos sobre un núcleo de madera.","imgs":[["ak_main","Vista general — tres cuartos"],["ak_front_c","Vista frontal"],["ak_detfront","Transición entre módulos — mesa central"],["ak_medio","Detalle — tapa de madera y apoyo"],["ak_view","Detalle — estructura inferior y apoyos"]],"points":[["Composición","Dos módulos continuos y un módulo independiente, separados por el elemento central."],["Tapizado","Respaldos y asientos son volúmenes tapizados de bordes redondeados."],["Elemento central","Caja con tapa de madera que funciona como mesa de apoyo entre módulos."],["Apoyos","Patas cilíndricas sobre la estructura inferior común."]]},{"t":"specs","label":"Desarrollo","h":"Estructura Corpo AK H","text":"Plano de la estructura inferior que soporta los módulos y el elemento central.","main":["ak_plan","Plano técnico — Corpo AK H"],"imgs":[],"specs":[["Largo","2559,5 mm"],["Ancho","800 mm"],["Altura","295 mm"],["Plano","S. Baliña · 08/09/2026"]]},{"t":"note","label":"Estado","text":"Propuesta de diseño documentada con renders y plano técnico. Los renders se presentan con la exposición corregida sobre los archivos originales, sin cambios de color ni de material."}],"num":"02"},{"slug":"ergonomia","title":"Ergonomía","cat":"Equipamiento urbano · Metro de Barcelona","year":"2026","thumb":"e_prop","tone":"light","summary":"Diagnóstico e intervención sobre el banco de espera de la estación Bac de Roda.","blocks":[{"t":"hero","img":"e_metro","layout":"split","sub":"Banco de espera · Bac de Roda (L2) · ESDi Barcelona","intro":"Estudio de las interacciones y condiciones de espera en la estación Bac de Roda del Metro de Barcelona, y rediseño del asiento a partir del diagnóstico antropométrico.","meta":[["Contexto","Ergonomía · ESDi Barcelona · 2026"],["Consigna","Analizar el Metro y mejorar un elemento"],["Rol","Proyecto individual"]]},{"t":"row","label":"Situación original","imgs":[["e_anden","Observación — andén de Bac de Roda"]]},{"t":"diag","label":"Diagnóstico","h":"Problemas detectados en el banco existente.","items":[["38 cm","de profundidad: el asiento no da soporte a los muslos y obliga a una postura inestable."],["43 cm · 90°","altura sin inclinación: el peso se desplaza hacia adelante y presiona la zona poplítea."],["Lumbar","apoyo alto y mínimo: se “clava” en pocas vértebras en lugar de distribuir la carga."],["Banco corrido","sin organización espacial que delimite el uso o facilite la circulación."]],"imgs":[["e_exist_a","Banco existente — sección"],["e_exist_b","Banco existente — modelo"]]},{"t":"phases","label":"Análisis de uso","img":["e_seq","Secuencia de uso registrada en el andén"],"items":[["Asentamiento","Sin profundidad ni inclinación, el cuerpo queda en “alerta muscular”."],["Permanencia","El apoyo lumbar alto fuerza una rotación de la pelvis."],["Bipedestación","Levantarse exige sobreesfuerzo en cuádriceps y zona lumbar."]]},{"t":"diag","label":"Propuesta de mejora","h":"Del soporte incómodo al reposo real.","big":["e_prop","Rediseño del asiento — render"],"items":[["5°","<b>Inclinación y más profundidad.</b> El usuario abandona la cifosis forzada; la columna recupera su curvatura con apoyo en la zona baja."],["R","<b>Radio en lugar de arista a 90°.</b> Suprime el “efecto guillotina” en el hueco poplíteo y facilita el balanceo para levantarse."],["Placa","<b>Placa anatómica en lugar de tubo.</b> Superficie ampliada que distribuye la carga lumbar de forma homogénea."]]},{"t":"pair","label":"Comparación","h":"Antes y después.","text":"A la izquierda, el banco existente; a la derecha, la propuesta. Debajo, la relación de cada asiento con el cuerpo: antes en rojo, después en verde.","a":["e_exist_b","Antes — banco existente"],"b":["e_prop","Después — propuesta"],"after":["e_ba","Antes (rojo) / después (verde) — relación con el cuerpo"]},{"t":"specs","label":"Organización espacial e inclusión","h":"Diagramación modular.","text":"<b>Diagramación modular</b> en lugar del banco corrido: rompe la monotonía del andén y ordena los flujos de circulación.<br><br><b>Espacios intercalados para sillas de ruedas</b>: la persona con movilidad reducida se integra en la misma línea de descanso que el resto de pasajeros.<br><br>Materiales de baja conductividad térmica en las zonas de contacto, para evitar el rechazo sensorial de la cerámica y el acero.","main":["e_plan","Plano del asiento — Banco Bac de Roda"],"imgs":[["e_org","Banco corrido actual / diagramación modular"]],"specs":[]},{"t":"note","label":"Estado","text":"Mejoras <b>esperadas</b> según el análisis antropométrico y biomecánico. La propuesta se documenta con renders y plano; no se registran ensayos con prototipo."}],"num":"03"},{"slug":"jugaia","title":"Jugaia","cat":"Objeto · Sistema de juego infantil","year":"—","thumb":"m_ph1","tone":"play","summary":"Sistema de juego infantil basado en la exploración libre y la construcción.","blocks":[{"t":"hero","img":"m_ph1","layout":"split","logo":"m_logo","intro":"Sistema de juego basado en la <b>exploración libre y la construcción</b>: piezas sin instrucciones rígidas ni estereotipos, donde el niño es la mente creativa y juega a su propio ritmo.","meta":[["Cátedra","Proyectos II"],["Tipo","Sistema de juego infantil"],["Familias","3 · piezas de madera"]]},{"t":"principles","label":"Principios de juego","img":["m_words","Mapa conceptual"],"lead":"Aprendizaje + Juego + Familia + Tiempo de calidad: un sistema que sostiene el equilibrio, la confianza y la asimilación del error.","items":[["Juego libre","Sin instrucciones rígidas ni estereotipos; el niño es la mente creativa."],["Ritmo respetuoso","Propuestas que inviten a jugar “sin prisa”, priorizando la exploración."],["Criterio pedagógico y estético","Objetos que despierten la curiosidad a través de un diseño cuidado."],["Sostenibilidad","Uso de materiales nobles, seguros y de bajo impacto ambiental."]]},{"t":"tabs","label":"Familias del sistema","h":"Elegí una familia para explorarla.","tabs":[{"name":"Estructura libre","imgs":[["m_p1","Estructura libre — render"],["m_ph2","Estructura libre — en uso"]],"points":[["Sin encastres fijos ni reglas","Una estructura tridimensional que crece libremente."],["Diseñar para el acierto","Piezas pasantes que eliminan el ‘este no anda’ y la frustración."],["Aprender el espacio jugando","Donde cada cruce de piezas abre un nuevo camino."],["Geometría libre","Formas que se conectan de cualquier manera y siempre funcionan."]]},{"name":"Bloques evolutivos","imgs":[["m_p2","Bloques evolutivos — render"],["m_ph3","Bloques evolutivos — en uso"]],"points":[["Evolutivo","Sirve a los 2 años para tirar, a los 5 para ciudades y a los 7 para geometría."],["Escala háptica","Escala pensada para la pinza digital y el desarrollo del agarre palmar."],["Foco en el proceso","Al quitarle los detalles al objeto, la mente del chico se concentra en la acción de crear y no en el juguete en sí."],["Abstracción total","Al no imitar formas reales (como autos o casas), el bloque no condiciona la temática del juego."]]},{"name":"Cubos numéricos","imgs":[["m_p3","Cubos numéricos — render"],["m_ph4","Cubos numéricos — en uso"]],"points":[["Apertura del sistema","El agujero no viene con instrucciones; es una invitación intuitiva a que el chico pase cordones, palitos o elementos de la naturaleza."],["Descomposición numérica","Facilita entender que un número grande (ej. el 9) está compuesto por unidades más chicas que se pueden separar físicamente."],["Traducción táctil","Pasa el número de un símbolo abstracto en papel a un vacío real que el chico puede tocar, mirar y contar."],["Pensamiento lateral","Al plantear ecuaciones inversas (dar el resultado primero), el chico busca libremente qué combinación de cubos suma esa cantidad."]]}]}],"num":"04"},{"slug":"reciclaje","title":"Reciclaje","cat":"Sistema modular · Madera recuperada","year":"2026","thumb":"r_sys","tone":"light","summary":"Sistema abierto de mobiliario a partir de madera de descarte del depósito.","blocks":[{"t":"hero","img":"r_sys","layout":"split","sub":"Sistema abierto","contain":true,"intro":"Residuos de madera localizados en el depósito son el punto de partida. <b>El descarte deja de ser basura para convertirse en un recurso técnico</b> de alta disponibilidad que dicta la lógica del sistema.","meta":[["Contexto","Proyectos II · ESDi Barcelona"],["Material","Madera de descarte del depósito"],["Unión","Ensamble en seco · pernos y nudos"],["Rol","Proyecto individual"]]},{"t":"sticky","label":"Material recuperado","h":"Preexistencia.","text":"Su geometría rectangular dada permite el calce natural de piezas sin necesidad de cortes complejos.","imgs":[["r_pre2","Preexistencia — madera de descarte"],["r_pre1","Preexistencia — pieza recuperada"]]},{"t":"row","label":"Sistema de piezas","imgs":[["r_desp","Acciones de despiece sobre la pieza recuperada"],["r_box","Transición de la geometría lineal a la volumétrica"]],"stack":true,"paper":true},{"t":"cards","label":"Conexiones","h":"Uniones rígidas y flexibles, en seco.","items":[["r_plate","Encuentro de tres planos","Tres planos convergentes actúan como un bloqueo mecánico natural que estabiliza toda la estructura. Escalabilidad total para pasar de un objeto pequeño a un sistema de pared sin perder la unidad visual."],["r_ens","Ensamble en seco","Desarmado total mediante el retiro de pernos, con recupero íntegro de la madera de descarte."],["r_hyb","Fijación híbrida","Un tornillo da fuerza y un nudo da flexibilidad en el mismo punto exacto."]]},{"t":"row","label":"Variantes de unión","imgs":[["r_var","Variantes de unión — hexagonal, cuadrada, triangular; rígidas y flexibles"]],"paper":true},{"t":"apps","label":"Aplicaciones","h":"Un mismo sistema, varias escalas.","items":[["r_ap1","Intervención exterior","Toldo y jardineras modulares en un patio."],["r_ap2","Mobiliario modular","Estantería y banco como equipamiento espacial interior."],["r_ap3","Rehabilitación acústica","Paneles suspendidos sobre una sala de lectura."]]},{"t":"note","label":"Estado","text":"Propuestas de aplicación documentadas con visualizaciones; los módulos no fueron construidos ni ensayados."}],"num":"05"},{"slug":"diseno-corporativo","title":"Diseño corporativo","cat":"Sistema de objetos · BNA–Peugeot","year":"2025","thumb":"acc_r","tone":"dark","summary":"Presente corporativo del Banco Nación a Peugeot: sillón, accesorio y vino.","blocks":[{"t":"hero","layout":"triptych","imgs":["sillon_l","acc_l","bot_l"],"sub":"Banco Nación → Peugeot","intro":"Tres objetos que unen la <b>solidez del BNA</b> con la <b>precisión de Peugeot</b>: verde petróleo para tradición y distinción; gris y detalles metálicos para tecnologí     h += '<a class="next" href="#' + next.slug + '"><div><span class="k">Siguiente proyecto · ' + next.num + '</span><span class="t">' + bl(next.title) + ' →</span><p class="w-c" style="margin-top:10px;color:var(--mid)">' + esc(next.cat) + '</p></div><div class="framed"><div class="fig" style="aspect-ratio:16/10">' + img(next.thumb, next.title, { sizes: '40vw' }) + '</div>' + CX + '</div></a>';
    h += '</div></nav></article>';
    FIG.p = null; SEC.p = null;
    return h;
  }

  // ── behaviours ────────────────────────
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.remove('pending'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' }) : null;
  function reveal(root) {
    if (!io || reduce) return;
    var vh = innerHeight;
    root.querySelectorAll('.rv').forEach(function (el) {
      if (el.getBoundingClientRect().top < vh * 0.95) return; // lo visible al cargar queda visible
      el.classList.add('pending'); io.observe(el);
    });
  }

  function bindViewers(root) {
    root.querySelectorAll('.vwr').forEach(function (v) {
      var list = JSON.parse(v.getAttribute('data-list')), cur = 0;
      var stage = v.querySelector('.stage-v'), btn = stage.querySelector('button'), im = btn.querySelector('img');
      var thumbs = v.querySelectorAll('.vthumb'), cap = v.querySelector('.vcap');
      function go(n) {
        cur = (n + list.length) % list.length; var k = list[cur][0], info = IMG[k];
        var nim = new Image(); nim.src = best(k); nim.alt = list[cur][1]; nim.width = info.w; nim.height = info.h; nim.className = 'out';
        btn.appendChild(nim);
        var show = function () { requestAnimationFrame(function () { nim.classList.remove('out'); im.classList.add('out'); var old = im; im = nim; setTimeout(function () { if (old.parentNode) old.remove(); }, reduce ? 0 : 650); }); };
        if (nim.complete) show(); else { nim.onload = show; nim.onerror = show; }
        if (!stage.classList.contains('paper')) stage.style.setProperty('--ar', info.w + ' / ' + info.h);
        btn.setAttribute('data-lb', k); btn.setAttribute('data-cap', list[cur][1]);
        thumbs.forEach(function (t, i) { t.setAttribute('aria-selected', i === cur); });
        cap.innerHTML = '<span class="ref num" style="color:var(--acc);font-weight:600;margin-right:.7em">' + (cur + 1) + '/' + list.length + '</span>' + esc(list[cur][1]);
      }
      thumbs.forEach(function (t) { t.addEventListener('click', function () { go(+t.getAttribute('data-i')); }); });
      v.querySelectorAll('[data-step]').forEach(function (b) { b.addEventListener('click', function () { go(cur + +b.getAttribute('data-step')); }); });
      v.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') { go(cur + 1); e.preventDefault(); } if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); } });
      swipe(stage, function (d) { go(cur + d); });
      v._list = function () { return list.map(function (x) { return x; }); };
      v._cur = function () { return cur; };
    });
  }
  function bindTabs(root) {
    root.querySelectorAll('[role="tablist"].tablist').forEach(function (tl) {
      var tabs = Array.prototype.slice.call(tl.querySelectorAll('.tab'));
      function sel(i, focus) {
        tabs.forEach(function (t, j) { var on = i === j; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
        if (focus) tabs[i].focus();
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { sel(i); });
        t.addEventListener('keydown', function (e) { var n = null; if (e.key === 'ArrowRight') n = (i + 1) % tabs.length; if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length; if (n !== null) { e.preventDefault(); sel(n, true); } });
      });
    });
  }
  function swipe(el, cb) {
    var x0 = null, y0 = null;
    el.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; x0 = e.clientX; y0 = e.clientY; });
    el.addEventListener('pointerup', function (e) { if (x0 === null) return; var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) cb(dx < 0 ? 1 : -1); });
    el.addEventListener('pointercancel', function () { x0 = null; });
  }

  // ── lightbox con zoom, desplazamiento y gestos ──
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('.lb-stage img'), lbStage = lb.querySelector('.lb-stage'), lbCap = lb.querySelector('.lb-cap'), lbCount = lb.querySelector('.lb-count'), lbLevel = lb.querySelector('.lb-level'), lbHint = lb.querySelector('.lb-hint');
  var lbList = [], lbI = 0, lastFocus = null, lbHist = false;
  var Z = { s: 1, x: 0, y: 0, max: 4 };
  var touchUI = window.matchMedia && matchMedia('(hover:none)').matches;
  function zBase() { // tamaño de la imagen ajustada (escala 1)
    var r = lbStage.getBoundingClientRect(), iw = lbImg.naturalWidth || +lbImg.getAttribute('width') || 1, ih = lbImg.naturalHeight || +lbImg.getAttribute('height') || 1;
    var k = Math.min(r.width / iw, r.height / ih, 1e9);
    return { w: iw * k, h: ih * k, W: r.width, H: r.height, L: r.left, T: r.top };
  }
  function zClamp() {
    var b = zBase(), mx = Math.max(0, (b.w * Z.s - b.W) / 2), my = Math.max(0, (b.h * Z.s - b.H) / 2);
    Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
  }
  function zApply(anim) {
    zClamp();
    lbImg.style.transition = anim && !reduce ? 'transform .28s cubic-bezier(.2,.7,.1,1)' : 'none';
    lbImg.style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')';
    lb.classList.toggle('zoomed', Z.s > 1.01);
    lbLevel.textContent = Math.round(Z.s * 100) + '%';
  }
  function zTo(s, cx, cy, anim) { // zoom alrededor de un punto de pantalla (cx, cy)
    var b = zBase(); s = Math.min(Z.max, Math.max(1, s));
    if (cx == null) { cx = b.L + b.W / 2; cy = b.T + b.H / 2; }
    var px = cx - (b.L + b.W / 2), py = cy - (b.T + b.H / 2), f = s / Z.s;
    Z.x = px - (px - Z.x) * f; Z.y = py - (py - Z.y) * f; Z.s = s; zApply(anim);
  }
  function zReset(anim) { Z.s = 1; Z.x = 0; Z.y = 0; zApply(anim); }
  function lbShow() {
    var x = lbList[lbI], info = IMG[x[0]], plan = /^dp_/.test(x[0]);
    lbImg.classList.toggle('paper', !!info.paper);
    Z.max = plan ? 6 : 3.5;
    lbImg.removeAttribute('src'); lbImg.src = best(x[0]); lbImg.alt = x[1]; lbImg.width = info.w; lbImg.height = info.h;
    lbCap.textContent = x[1] + (plan && /Plano/.test(x[1]) ? ' · A3 · cotas en mm' : ''); lbCount.textContent = (lbI + 1) + ' / ' + lbList.length;
    lb.querySelector('.lb-prev').hidden = lb.querySelector('.lb-next').hidden = lbList.length < 2;
    lbHint.textContent = touchUI ? 'Pellizcá o tocá dos veces para ampliar' : 'Doble clic o rueda del mouse para ampliar';
    lb.classList.add('hint'); clearTimeout(lbShow._t); lbShow._t = setTimeout(function () { lb.classList.remove('hint'); }, 2600);
    zReset(false);
  }
  function lbOpen(list, i) {
    lbList = list; lbI = i; lastFocus = document.activeElement; lb.hidden = false; document.documentElement.classList.add('lb-open');
    try { history.pushState({ lb: 1 }, ''); lbHist = true; } catch (er) { lbHist = false; }
    lbShow(); lb.querySelector('.lb-close').focus();
  }
  function lbDone() { lb.hidden = true; document.documentElement.classList.remove('lb-open'); zReset(false); if (lastFocus) lastFocus.focus({ preventScroll: true }); }
  function lbClose() { if (lb.hidden) return; if (lbHist) { lbHist = false; history.back(); } else lbDone(); }
  addEventListener('popstate', function () { if (!lb.hidden) { lbHist = false; lbDone(); } });
  function lbStep(d) { if (lbList.length < 2) return; lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); }
  lb.querySelector('.lb-close').addEventListener('click', lbClose);
  lb.querySelector('.lb-prev').addEventListener('click', function () { lbStep(-1); });
  lb.querySelector('.lb-next').addEventListener('click', function () { lbStep(1); });
  lb.querySelector('.lb-in').addEventListener('click', function () { zTo(Z.s * 1.6, null, null, true); });
  lb.querySelector('.lb-out').addEventListener('click', function () { zTo(Z.s / 1.6, null, null, true); });
  lb.querySelector('.lb-fit').addEventListener('click', function () { zReset(true); });
  lbImg.addEventListener('load', function () { zApply(false); });
  addEventListener('resize', function () { if (!lb.hidden) zApply(false); });
  // gestos: arrastrar (con zoom), pellizcar, deslizar (sin zoom), doble toque
  var ptrs = {}, g = null, lastTap = 0, moved = false;
  function pts() { return Object.keys(ptrs).map(function (k) { return ptrs[k]; }); }
  lbStage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    try { lbStage.setPointerCapture(e.pointerId); } catch (er) { /* puntero sintético o ya liberado */ }
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = false;
    var p = pts();
    if (p.length === 1) g = { t: 'pan', x0: e.clientX, y0: e.clientY, zx: Z.x, zy: Z.y, t0: Date.now() };
    else if (p.length === 2) g = { t: 'pinch', d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s0: Z.s, cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2, zx: Z.x, zy: Z.y };
  });
  lbStage.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId] || !g) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = pts();
    if (g.t === 'pinch' && p.length >= 2) {
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s = Math.min(Z.max, Math.max(1, g.s0 * d / g.d0));
      var b = zBase(), px = g.cx - (b.L + b.W / 2), py = g.cy - (b.T + b.H / 2), f = s / g.s0;
      var mx = (p[0].x + p[1].x) / 2 - g.cx, my = (p[0].y + p[1].y) / 2 - g.cy;
      Z.s = s; Z.x = px - (px - g.zx) * f + mx; Z.y = py - (py - g.zy) * f + my; zApply(false); moved = true;
    } else if (g.t === 'pan') {
      var dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      if (Z.s > 1.01) { Z.x = g.zx + dx; Z.y = g.zy + dy; zApply(false); }
    }
  });
  function ptrEnd(e) {
    if (!ptrs[e.pointerId]) return;
    var wasPan = g && g.t === 'pan', dx = g && wasPan ? e.clientX - g.x0 : 0, dy = g && wasPan ? e.clientY - g.y0 : 0, dt = g && wasPan ? Date.now() - g.t0 : 0;
    delete ptrs[e.pointerId];
    var p = pts();
    if (p.length === 1) { g = { t: 'pan', x0: p[0].x, y0: p[0].y, zx: Z.x, zy: Z.y, t0: Date.now() }; return; }
    g = null;
    if (!wasPan || e.type === 'pointercancel') return;
    if (Z.s <= 1.01 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3 && dt < 700) { lbStep(dx < 0 ? 1 : -1); return; }
    if (!moved) { // toque simple / doble toque
      var now = Date.now();
      if (now - lastTap < 320) { lastTap = 0; if (Z.s > 1.01) zReset(true); else zTo(/^dp_/.test(lbList[lbI][0]) ? 3 : 2.2, e.clientX, e.clientY, true); }
      else lastTap = now;
    }
  }
  lbStage.addEventListener('pointerup', ptrEnd);
  lbStage.addEventListener('pointercancel', ptrEnd);
  lbStage.addEventListener('wheel', function (e) { e.preventDefault(); zTo(Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022)), e.clientX, e.clientY, false); }, { passive: false });
  lb.addEventListener('click', function (e) { if (e.target === lb) lbClose(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowRight') lbStep(1); else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === '+' || e.key === '=') zTo(Z.s * 1.6, null, null, true); else if (e.key === '-') zTo(Z.s / 1.6, null, null, true); else if (e.key === '0') zReset(true);
    else if (e.key === 'Tab') { var f = lb.querySelectorAll('button:not([hidden])'); if (!f.length) return; var first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); } else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); } }
  });
  app.addEventListener('click', function (e) {
    var z = e.target.closest('.zoom'); if (!z) return;
    e.preventDefault();
    var vwr = z.closest('.vwr');
    if (vwr && vwr._list) { lbOpen(vwr._list(), vwr._cur()); return; }
    var grp = z.getAttribute('data-group');
    var all = grp ? Array.prototype.slice.call(app.querySelectorAll('.zoom[data-group="' + grp + '"]')) : Array.prototype.slice.call((z.closest('.blk') || app).querySelectorAll('.zoom:not(.vwr .zoom):not([data-group])'));
    var list = all.map(function (n) { return [n.getAttribute('data-lb'), n.getAttribute('data-cap')]; });
    lbOpen(list, Math.max(0, all.indexOf(z)));
  });

  // ── menú móvil ──
  var mbtn = document.querySelector('.menu-btn'), mnav = document.getElementById('mnav');
  function menu(open) {
    mbtn.setAttribute('aria-expanded', open); mnav.hidden = !open; document.documentElement.classList.toggle('menu-open', open);
    if (open) { var a = mnav.querySelector('a'); if (a) a.focus(); } else mbtn.focus({ preventScroll: true });
  }
  if (mbtn && mnav) {
    mbtn.addEventListener('click', function () { menu(mbtn.getAttribute('aria-expanded') !== 'true'); });
    mnav.addEventListener('click', function (e) { if (e.target.closest('a') || e.target === mnav) { mbtn.setAttribute('aria-expanded', false); mnav.hidden = true; document.documentElement.classList.remove('menu-open'); } });
    document.addEventListener('keydown', function (e) {
      if (mnav.hidden) return;
      if (e.key === 'Escape') menu(false);
      if (e.key === 'Tab') { var f = [mbtn].concat(Array.prototype.slice.call(mnav.querySelectorAll('a,button'))), i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { f[f.length - 1].focus(); e.preventDefault(); } else if (!e.shiftKey && i === f.length - 1) { f[0].focus(); e.preventDefault(); } }
    });
    addEventListener('resize', function () { if (innerWidth > 760 && !mnav.hidden) menu(false); });
  }

  // copiar correo / descargar PDF / scroll
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200); }
  app.addEventListener('click', function (e) {
    if (e.target.closest('#copy-mail')) {
      var done = function () { toast('Correo copiado'); };
      var fallback = function () { var r = document.createRange(); r.selectNodeContents(document.getElementById('mail-addr')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Correo seleccionado: copialo con Ctrl/Cmd + C'); };
      try { navigator.clipboard.writeText(S.email).then(done, fallback); } catch (er) { fallback(); }
    }
    var dl = e.target.closest('#dl-pdf');
    if (dl && window.claude && window.claude.use) {
      e.preventDefault();
      window.claude.use('downloads').then(function (d) {
        if (!d) { toast('La descarga no está disponible en esta vista'); return; }
        return fetch(S.pdf).then(function (r) { return r.blob(); }).then(function (blob) { return d.save({ filename: S.pdf, data: blob }); })
          .then(function () { toast('Portfolio descargado'); }, function (er) { if (er && er.code !== 'declined') toast('No se pudo descargar el PDF'); });
      });
    }
    var sc = e.target.closest('[data-scroll]');
    if (sc) { e.preventDefault(); var el = document.getElementById(sc.getAttribute('data-scroll')); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); }
  });

  // progreso del proyecto
  var bar = document.querySelector('.progress');
  function onScroll() {
    if (!document.body.classList.contains('is-project')) { bar.style.transform = 'scaleX(0)'; return; }
    var max = document.documentElement.scrollHeight - innerHeight; bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, scrollY / max) : 0) + ')';
  }
  addEventListener('scroll', onScroll, { passive: true });

  // ── router ────────────────────────────
  var SECTIONS = ['proyectos', 'sobre-mi', 'contacto'];
  var VT = !reduce && typeof document.startViewTransition === 'function';
  var pendingVT = null;
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.work, .pnav a'); if (!a || !VT) return;
    var f = a.querySelector('[data-vt]') || a.querySelector('.fig');
    if (f) { f.style.viewTransitionName = 'p-hero'; pendingVT = true; }
  }, true);
  function route() {
    if (pendingVT && VT) {
      pendingVT = null;
      var t = document.startViewTransition(function () { doRoute(); var hero = app.querySelector('[data-vt]'); if (hero) hero.style.viewTransitionName = 'p-hero'; });
      t.finished.then(function () { var hero = app.querySelector('[data-vt]'); if (hero) hero.style.viewTransitionName = ''; });
      return;
    }
    doRoute();
  }
  var homeY = 0, fromHistory = false;
  addEventListener('popstate', function () { fromHistory = true; clearTimeout(doRoute._t); doRoute._t = setTimeout(function () { fromHistory = false; }, 400); });
  function doRoute() {
    var hash = decodeURIComponent(location.hash.replace('#', ''));
    var p = P[SLUGS.indexOf(hash)];
    var back = fromHistory; fromHistory = false;
    if (p && !document.body.classList.contains('is-project')) homeY = scrollY;
    var navs = document.querySelectorAll('.nav a');
    navs.forEach(function (a) { a.removeAttribute('aria-current'); });
    if (p) {
      document.body.classList.add('is-project');
      app.innerHTML = renderProject(p);
      document.title = p.title + ' — Simón Baliña';
      document.querySelector('.crumb').textContent = p.num + ' / 0' + P.length + ' · ' + p.title;
      scrollTo(0, 0);
      navs[0].setAttribute('aria-current', 'true');
    } else {
      var wasProject = document.body.classList.contains('is-project') || !app.firstChild;
      document.body.classList.remove('is-project');
      if (wasProject) { app.innerHTML = homeHTML || (homeHTML = renderHome()); }
      document.title = 'Simón Baliña — Diseño industrial / Diseño de producto';
      if (SECTIONS.indexOf(hash) > -1) {
        var el = document.getElementById(hash); navs[SECTIONS.indexOf(hash)].setAttribute('aria-current', 'true');
        if (el) requestAnimationFrame(function () { if (back && wasProject) scrollTo(0, homeY); else el.scrollIntoView({ behavior: wasProject || reduce ? 'auto' : 'smooth' }); });
      } else if (wasProject) scrollTo(0, back ? homeY : 0);
    }
    bindViewers(app); bindTabs(app); reveal(app); onScroll();
    var h1 = app.querySelector('h1'); if (p && h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  }
  addEventListener('hashchange', route);
  route();
})();
</script>
